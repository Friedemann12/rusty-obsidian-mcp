[package]
name = "rusty-obsidian-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for Obsidian, powered by the Obsidian CLI"

[features]
default = []
http = ["dep:axum", "dep:tokio-util", "dep:rand", "rmcp/transport-streamable-http-server"]
tunnel = ["http", "dep:ngrok", "dep:url"]

[dependencies]
rmcp = { version = "1.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2"

axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", optional = true }
rand = { version = "0.9", optional = true }

ngrok = { version = "0.18", optional = true }
url = { version = "2.5", optional = true }
